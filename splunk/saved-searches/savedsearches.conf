[Brute Force Detection - 4625 ths will make it Spike]
action.email = 1
action.email.to = soc-alerts@yourdomain.local
action.email.subject.alert = [SOC ALERT] Potential Brute-Force Attack Detected
alert.severity = 3
alert.suppress = 0
alert.trigger_condition = where count > 3
alert.type = number of events
cron_schedule = */5 * * * *
description = Detects repeated failed login attempts over 3 occurrences.
enableSched = 1
search = index=main EventCode=4625 | stats count by Account_Name, Client_Computer_Name | where count > 3

